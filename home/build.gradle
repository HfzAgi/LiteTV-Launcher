plugins {
    id 'com.android.application'
}

// Berasal dari https://github.com/Gathin23/cleanyourtv (launcher/app), lisensi MIT. Lihat NOTICE.md.
android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName '3.6'
    }

    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Dipasang manual (sideload): tanda tangan debug supaya bisa menimpa build debug.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
