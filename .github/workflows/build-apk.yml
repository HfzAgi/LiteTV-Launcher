name: Build LiteTV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK (signature and manifest)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: LiteTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LiteTV-APK
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: sh scripts/ci-test.sh apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshot
          path: screen.png
          if-no-files-found: ignore

  release:
    needs: emulator-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LiteTV-APK
          path: apk
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" apk/app-debug.apk \
            --repo "${{ github.repository }}" --prerelease \
            --title "LiteTV debug build #${{ github.run_number }}" \
            --notes "Debug APK. Lolos tes pasang dan buka di emulator Android 14."
